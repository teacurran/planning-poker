name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-22.04
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging \
            -f backend/src/main/docker/Dockerfile.jvm \
            backend/

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

      - name: Deploy to Kubernetes (Staging)
        run: |
          # Note: This requires kubectl to be configured with staging cluster credentials
          # Configure kubectl context (add your staging cluster config here)
          # kubectl config use-context staging-cluster

          # Apply Kubernetes manifests
          # kubectl apply -k infra/kubernetes/overlays/staging

          # Wait for rollout to complete
          # kubectl rollout status deployment/scrum-poker-backend -n staging --timeout=5m

          echo "⚠️ Kubernetes deployment skipped (cluster not configured in this workflow)"
          echo "In production, this step would deploy to staging Kubernetes cluster"

      - name: Wait for staging deployment to be ready
        run: |
          echo "Waiting for staging deployment to stabilize..."
          sleep 30

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (Frontend)
        id: smoke-tests-frontend
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.STAGING_URL || 'https://staging.planningpoker.example.com' }}
          SMOKE_TEST_MOCK_OAUTH: 'true'
        run: |
          npm run test:smoke
        continue-on-error: true

      - name: Run smoke tests (Backend)
        id: smoke-tests-backend
        working-directory: backend
        env:
          SMOKE_BASE_URL: ${{ secrets.STAGING_API_URL || 'https://staging-api.planningpoker.example.com' }}
        run: |
          mvn test -Dtest=SmokeTestSuite
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-staging
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/surefire-reports/
          retention-days: 7

      - name: Check smoke test results
        if: steps.smoke-tests-frontend.outcome == 'failure' || steps.smoke-tests-backend.outcome == 'failure'
        run: |
          echo "❌ Smoke tests failed on staging deployment!"
          echo "Frontend smoke tests: ${{ steps.smoke-tests-frontend.outcome }}"
          echo "Backend smoke tests: ${{ steps.smoke-tests-backend.outcome }}"
          exit 1

      - name: Notify success
        if: success()
        run: |
          echo "✅ Staging deployment successful! Smoke tests passed."
          echo "Staging URL: ${{ secrets.STAGING_URL || 'https://staging.planningpoker.example.com' }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Staging deployment or smoke tests failed!"
          echo "Check the workflow logs and test results for details."

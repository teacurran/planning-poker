name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-22.04
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -f backend/src/main/docker/Dockerfile.jvm \
            backend/

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Kubernetes (Production)
        id: deploy
        run: |
          # Note: This requires kubectl to be configured with production cluster credentials
          # Configure kubectl context
          # kubectl config use-context production-cluster

          # Apply Kubernetes manifests
          # kubectl apply -k infra/kubernetes/overlays/production

          # Wait for rollout to complete
          # kubectl rollout status deployment/scrum-poker-backend -n production --timeout=5m

          echo "⚠️ Kubernetes deployment skipped (cluster not configured in this workflow)"
          echo "In production, this step would deploy to production Kubernetes cluster"

          # Save current revision for potential rollback
          # PREVIOUS_REVISION=$(kubectl rollout history deployment/scrum-poker-backend -n production | tail -2 | head -1 | awk '{print $1}')
          # echo "previous_revision=$PREVIOUS_REVISION" >> $GITHUB_OUTPUT

      - name: Wait for production deployment to be ready
        run: |
          echo "Waiting for production deployment to stabilize..."
          sleep 60

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests (Frontend)
        id: smoke-tests-frontend
        working-directory: frontend
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://app.planningpoker.example.com' }}
          SMOKE_TEST_MOCK_OAUTH: 'false'
        run: |
          npm run test:smoke
        continue-on-error: true

      - name: Run smoke tests (Backend)
        id: smoke-tests-backend
        working-directory: backend
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.planningpoker.example.com' }}
        run: |
          mvn test -Dtest=SmokeTestSuite
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results-production
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend/target/surefire-reports/
          retention-days: 30

      - name: Rollback deployment on smoke test failure
        if: steps.smoke-tests-frontend.outcome == 'failure' || steps.smoke-tests-backend.outcome == 'failure'
        run: |
          echo "🚨 SMOKE TESTS FAILED! Initiating automatic rollback..."
          echo "Frontend smoke tests: ${{ steps.smoke-tests-frontend.outcome }}"
          echo "Backend smoke tests: ${{ steps.smoke-tests-backend.outcome }}"

          # Rollback Kubernetes deployment
          # kubectl rollout undo deployment/scrum-poker-backend -n production
          # kubectl rollout status deployment/scrum-poker-backend -n production --timeout=5m

          echo "⚠️ Kubernetes rollback skipped (cluster not configured in this workflow)"
          echo "In production, this step would rollback to previous revision"

          # Send rollback alert
          echo "📧 Sending rollback alert to team..."

      - name: Send Slack alert on failure
        if: steps.smoke-tests-frontend.outcome == 'failure' || steps.smoke-tests-backend.outcome == 'failure'
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "🚨 Production Smoke Tests Failed! Rollback initiated.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Failed*\n\nSmoke tests detected critical issues. Deployment has been rolled back.\n\n*Test Results:*\n• Frontend: ${{ steps.smoke-tests-frontend.outcome }}\n• Backend: ${{ steps.smoke-tests-backend.outcome }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Test Results>"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Fail workflow if smoke tests failed
        if: steps.smoke-tests-frontend.outcome == 'failure' || steps.smoke-tests-backend.outcome == 'failure'
        run: |
          echo "❌ Production deployment failed smoke tests and has been rolled back."
          exit 1

      - name: Send Slack success notification
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "✅ Production deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment Successful*\n\nAll smoke tests passed. New version is live.\n\n*Deployed:*\n• Commit: ${{ github.sha }}\n• Author: ${{ github.actor }}\n• URL: ${{ secrets.PRODUCTION_URL || 'https://app.planningpoker.example.com' }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Notify success
        if: success()
        run: |
          echo "✅ Production deployment successful! Smoke tests passed."
          echo "Production URL: ${{ secrets.PRODUCTION_URL || 'https://app.planningpoker.example.com' }}"
          echo "Deployed commit: ${{ github.sha }}"

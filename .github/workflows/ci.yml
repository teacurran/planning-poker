# DEPRECATED: This workflow is superseded by backend-ci.yml and frontend-ci.yml
# It predates the backend/frontend split and uses Docker Compose for testing.
# Consider removing this workflow once the new CI workflows have been validated.
# New workflows provide better separation of concerns and run in parallel.

name: ci

on:
  push:
    branches:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: docker compose up
        run: docker compose up -d jaeger postgresql

      - name: Test
        run: docker compose run server mvn test

      - name: Sonarqube
        run: docker compose run server mvn verify sonar:sonar -Dsonar.login=${{ secrets.SONAR_TOKEN }} -Dsonar.host.url="https://sonarcloud.io"

      - name: docker compose down
        run: docker compose down

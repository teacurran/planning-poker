name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      REGISTRY_IMAGE: planning-poker-backend:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run tests
        working-directory: ./backend
        run: mvn clean verify
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Build backend Docker image
        working-directory: ./backend
        run: docker build -t ${{ env.REGISTRY_IMAGE }} .

      - name: Run Trivy security scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        if: always() && steps.trivy-scan.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fail workflow if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy detected CRITICAL or HIGH vulnerabilities."
          exit 1

      - name: SonarQube analysis
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.SONAR_TOKEN != ''
        working-directory: ./backend
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=planning-poker-backend \
            -Dsonar.organization=YOUR_SONAR_ORG \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend Test Results
          path: backend/target/surefire-reports/*.xml,backend/target/failsafe-reports/*.xml
          reporter: java-junit
          fail-on-error: true
        continue-on-error: true
